name: VSCode Extension

on:

  # Release is ONLY triggered manually from the Actions tab.
  # It reads the version from package.json, creates the tag, and publishes.
  workflow_dispatch:
    inputs:
      auth:
        description: "Marketplace authentication method"
        type: choice
        default: oidc
        options:
          - oidc   # trusted publishing, no stored secret (preferred)
          - pat    # VSCE_PAT secret — org-scoped, dies 2026-12-01

jobs:

  # ── Build & package ──────────────────────────────────────────────────────
  # Runs on every push to main and on every manual dispatch.
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix:    ${{ steps.meta.outputs.vsix }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run compile

      - name: Unit tests (pure core modules)
        run: node tests/unit.js

      - name: Read version from package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from package.json"
            exit 1
          fi
          echo "version=${VERSION}"              >> $GITHUB_OUTPUT
          echo "vsix=vscode-fly-${VERSION}.vsix" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

      # Use the scoped name: bare `vsce` on npm is the deprecated pre-2022 package.
      - name: Package (.vsix)
        run: npx @vscode/vsce package --out vscode-fly-${{ steps.meta.outputs.version }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-fly-vsix
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error

  # ── Tag + GitHub Release + Marketplace publish ───────────────────────────
  # Runs ONLY on manual workflow_dispatch.
  # Fails immediately if the tag for the current version already exists.
  release:
    needs: [build]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create tag and GitHub Release
      id-token: write   # needed for OIDC trusted publishing to the Marketplace

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git ls-remote sees all tags

      - name: Fail if tag already exists
        run: |
          VERSION=${{ needs.build.outputs.version }}
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists. Bump the version in package.json before releasing."
            exit 1
          fi
          echo "Tag v${VERSION} is available — proceeding with release."

      - name: Create and push tag
        run: |
          VERSION=${{ needs.build.outputs.version }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: vscode-fly-vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "Fly VSCode Extension v${{ needs.build.outputs.version }}"
          body: |
            ## Fly Language Support for VSCode — v${{ needs.build.outputs.version }}

            ### What's included
            - AUpdate lsp path

            ### Install
            Download `${{ needs.build.outputs.vsix }}` then run:
            ```
            code --install-extension ${{ needs.build.outputs.vsix }}
            ```
            or drag-and-drop the file into the VSCode Extensions panel.
          files: ${{ needs.build.outputs.vsix }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── Marketplace publish ──────────────────────────────────────────────
      # Preferred: OIDC trusted publishing. No secret is stored anywhere — vsce
      # asks GitHub for an id-token scoped to the marketplace.visualstudio.com
      # audience and trades it for a short-lived Marketplace credential.
      # Requires `id-token: write` above AND a trusted-publishing policy on the
      # fly-lang publisher naming this repo + this workflow file.
      # NOTE: --oidc never falls back to a PAT; if the exchange fails, it fails.
      - name: Publish to VS Code Marketplace (OIDC)
        if: inputs.auth == 'oidc'
        run: npx --yes '@vscode/vsce@^3.9.2' publish --oidc --packagePath ${{ needs.build.outputs.vsix }}

      # Fallback while the OIDC policy is not yet in place.
      # VSCE_PAT must be an ORGANIZATION-SCOPED PAT (Marketplace > Manage).
      # Global "All accessible organizations" PATs stop working 2026-12-01.
      - name: Publish to VS Code Marketplace (PAT)
        if: inputs.auth == 'pat'
        run: npx --yes '@vscode/vsce@^3.9.2' publish --packagePath ${{ needs.build.outputs.vsix }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
